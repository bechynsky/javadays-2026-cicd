spring.application.name=javadays-cicd-demo

# App Service předává port v proměnné prostředí, lokálně běžíme na 8080
server.port=${PORT:8080}

# Hodnoty nastavuje Bicep jako app settings (infra/main.bicep)
app.environment=${APP_ENVIRONMENT:local}
app.theme-color=${APP_THEME_COLOR:#1F6FEB}
# Použijeme v demu – krok 3
app.monitoring=${APP_MONITORING:false}

# Health check pro App Service: /actuator/health
management.endpoints.web.exposure.include=health,info
