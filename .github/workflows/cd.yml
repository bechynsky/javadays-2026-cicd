# CD: po merge do main
# 1) build + testy -> artefakt app.jar (build jednou, nasaď kamkoliv)
# 2) infrastruktura z Bicepu (nejdřív prostředí)
# 3) nasazení aplikace do App Service + smoke test
name: CD

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token pro přihlášení do Azure
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
          cache: maven

      - name: Build, testy, balíček
        run: mvn -B verify -Dbuild.number=${{ github.run_number }} -Dgit.sha=${{ github.sha }}

      - name: Uložit app.jar
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: target/app.jar
          if-no-files-found: error

  infra:
    name: Infrastruktura (Bicep)
    runs-on: ubuntu-latest
    # Bez nastavení Azure (scripts/setup-azure.sh) se nasazení přeskočí
    if: vars.AZURE_CLIENT_ID != ''
    environment: dev
    outputs:
      webAppName: ${{ steps.deploy.outputs.webAppName }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - name: Přihlášení do Azure (OIDC, bez hesla)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Nasazení Bicep šablony
        id: deploy
        run: |
          outputs=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "cd-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json)
          echo "webAppName=$(echo "$outputs" | jq -r .webAppName.value)" >> "$GITHUB_OUTPUT"
          echo "url=$(echo "$outputs" | jq -r .url.value)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Nasazení aplikace
    needs: [ build, infra ]
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ needs.infra.outputs.url }}
    steps:
      - name: Stáhnout app.jar
        uses: actions/download-artifact@v8
        with:
          name: app

      - name: Přihlášení do Azure (OIDC, bez hesla)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Nasazení JAR do App Service
        run: |
          az webapp deploy \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ needs.infra.outputs.webAppName }}" \
            --src-path app.jar \
            --type jar

      - name: Smoke test – běží nový build?
        run: |
          url="${{ needs.infra.outputs.url }}/api/info"
          expected="${{ github.run_number }}"
          for i in $(seq 1 30); do
            running=$(curl -fsS "$url" | jq -r .buildNumber || true)
            echo "Pokus $i: běží build '${running}', čekám '${expected}'"
            if [ "$running" = "$expected" ]; then
              echo "✅ Build #${expected} běží na ${{ needs.infra.outputs.url }}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Nová verze se do 5 minut neozvala."
          exit 1
